<main>
  <!-- Lado Izquierdo: Banner -->
  <section class="banner-section">
    <h1>Inicia sesión</h1>
    <p>Accede a tu cuenta para continuar trabajando en tus<br>proyectos y recursos favoritos.</p>

    <div class="image-container">
      <img src=".png" alt="Ilustración de inicio de sesión" />
    </div>

    <div class="info-card">
      <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>Miles de profesionales ya utilizan nuestra plataforma para crear y escalar.</span>
    </div>
  </section>

  <!-- Lado Derecho: Formulario -->
  <section class="login-section">
    <h1 class="Title">Inicia Sesión</h1>
    <p>Ingresa tus datos para acceder a tu cuenta.</p>

    <div class="input-group">
      <app-input id="email" label="Correo Electronico" placeholder="nombre@empresa.com"/>
    </div>

    <div class="input-group">
      <app-input 
        id="password" 
        label="Contraseña" 
        placeholder="ingresa tu contraseña"
        [type]="showPassword ? 'text' : 'password'"/>

      <button
        type="button"
        class="button-eye"
        (click)="togglePasswordVisibility()"
        aria-label="Mostrar u ocultar contraseña">
        
        <!-- Ojo abierto -->
        <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>

        <!-- Ojo tachado -->
        <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
          <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          <line x1="2" x2="22" y1="2" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="Footer">
      <button class="Button-Login">Login Now</button>
    </div>

    <div class="login-divider">
      <hr/>
      <span><b>Login</b></span>
      <span class="color-text">with others</span>
      <hr/>
    </div>
  </section>
</main>
